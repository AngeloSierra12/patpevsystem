<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard &middot; PATVEP Hostel &amp; Canteen System</title>
<meta name="description" content="Administrative dashboard for the IGP PATVEP Hostel and University Canteen system.">
<link rel="icon" type="image/png" href="assets/img/bpsu-logo.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<main class="main">
  <div class="page-body">

    <div class="page-head">
      <div class="page-head__text">
        <h1>Operations Dashboard</h1>
        <div class="page-meta" id="pageMeta"></div>
      </div>
      <div class="page-head__actions">
        <button class="btn" id="btnRefresh" data-icon="refresh">Refresh</button>
        <a class="btn btn--primary" href="pages/calendar.html" data-perm="calendar.view"
           data-icon="calendar">Open calendar</a>
      </div>
    </div>

    <!-- 7.2 Metrics integration -->
    <section id="statRow" class="grid grid--4 mb-2" aria-label="Key metrics"></section>

    <div class="grid grid--sidebar mb-2">
      <div>
        <!-- Hostel occupancy -->
        <section class="card mb-2">
          <div class="card__head">
            <div>
              <div class="card__title">Hostel occupancy, next 7 days</div>
              <div class="card__sub">22 rooms &middot; 7 nights</div>
            </div>
            
          </div>
          <div class="card__body" id="occChart"></div>
        </section>

        <!-- Canteen stock -->
        <section class="card">
          <div class="card__head">
            <div>
              <div class="card__title">Canteen stock levels</div>
              <div class="card__sub">Quantity vs reorder point</div>
            </div>
            <div class="card__tools">
              <a class="btn btn--sm" href="pages/module-inventory.html"
                 data-perm="inventory.view" data-perm-mode="disable">Inventory module</a>
            </div>
          </div>
          <div class="card__body" id="stockChart"></div>
        </section>
      </div>

      <div>
        <!-- 7.3 Quick actions -->
        <section class="card mb-2">
          <div class="card__head">
            <div>
              <div class="card__title">Quick actions</div>
              <div class="card__sub">Role-filtered</div>
            </div>
            
          </div>
          <div class="card__body" id="quickActions"></div>
        </section>

        <!-- Room status -->
        <section class="card mb-2">
          <div class="card__head">
            <div class="card__title">Room status today</div>
          </div>
          <div class="card__body" id="roomDonut"></div>
        </section>

        <!-- Low stock -->
        <section class="card">
          <div class="card__head">
            <div class="card__title">Low stock alerts</div>
            <div class="card__tools"><span class="badge badge--danger" id="lowCount">0</span></div>
          </div>
          <div class="card__body card__body--flush" id="lowStock"></div>
        </section>
      </div>
    </div>

    <!-- Today's movement -->
    <div class="grid grid--2">
      <section class="card">
        <div class="card__head">
          <div>
            <div class="card__title">Arrivals &amp; departures today</div>
            <div class="card__sub" id="todayDate"></div>
          </div>
        </div>
        <div class="card__body card__body--flush" id="movement"></div>
      </section>

      <section class="card">
        <div class="card__head">
          <div>
            <div class="card__title">Upcoming schedule</div>
            
          </div>
          <div class="card__tools">
            <a class="btn btn--sm" href="pages/calendar.html" data-perm="calendar.view">View all</a>
          </div>
        </div>
        <div class="card__body card__body--flush" id="upcoming"></div>
      </section>
    </div>

  </div>
</main>

<script src="assets/js/core/util.js"></script>
<script src="assets/js/data/mock-data.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/rbac.js"></script>
<script src="assets/js/core/session.js"></script>
<script src="assets/js/core/scheduling.js"></script>
<script src="assets/js/ui/charts.js"></script>
<script src="assets/js/ui/icons.js"></script>
<script src="assets/js/ui/shell.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
