<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - PATVEP StockHub</title>
    <link rel="icon" type="image/png" href="images/bpsu-logo.png">
    <link rel="stylesheet" type="text/css" href="css/index.css">
</head>
<body>

    <div id="login-page">

        <img id="logo" src="images/bpsu-logo.png" alt="BPSU logo">
        <h1>PATVEP StockHub</h1>
        <p id="school">Bataan Peninsula State University - Main Campus</p>

        <div class="login">
            <h2>Log in</h2>

            <!-- no database yet, so any username and password just goes to the dashboard -->
            <form id="login" action="dashboard.html">
                <label for="Uname"><b>Username</b></label>
                <input type="text" id="Uname" required>
                <br><br>
                <label for="Pass"><b>Password</b></label>
                <input type="password" id="Pass" required>
                <br><br>
                <input type="checkbox" id="check">
                <span>Remember me</span>
                <br><br>
                <button type="submit" id="btn">Log in</button>
            </form>

        </div>

        <p id="forgot"><a href="#forgot-password">Forgot your password?</a></p>

    </div>

    <!-- popup opens with #forgot-password in the link. there is no email, so the request goes to the admin -->
    <div class="popup" id="forgot-password">
        <div class="popup-box">
            <h2>Forgot your password?</h2>
            <p class="note">Send a request to the admin. The admin will reset your password and give you the new one.</p>
            <form id="forgot-form" action="index.html">
                <label for="forgot-user"><b>Username</b></label>
                <input type="text" id="forgot-user" required>
                <br><br>
                <label for="forgot-note"><b>Message for the admin (optional)</b></label>
                <textarea id="forgot-note" maxlength="200" placeholder="Example: I am at the canteen today"></textarea>
                <p class="sent" id="forgot-sent" hidden></p>
                <div class="actions">
                    <a class="button" href="#">Cancel</a>
                    <button type="submit" id="send-btn">Send request</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/connect-login.js"></script>
</body>
</html>
