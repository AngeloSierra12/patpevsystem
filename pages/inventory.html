<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen Inventory &middot; PATVEP Hostel &amp; Canteen</title>
<link rel="icon" type="image/png" href="../assets/img/bpsu-logo.png">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<main class="main">
  <div class="page">

    <div class="page__head">
      <div>
        <h1>Canteen Inventory</h1>
        <div class="page__meta" id="pageMeta"></div>
      </div>
      <div class="page__actions">
        <button class="btn" id="btnConsume" data-icon="box">Record usage</button>
        <button class="btn" id="btnDelivery" data-icon="inbox">Record delivery</button>
        <button class="btn btn--go" id="btnItem" data-icon="plus">Add item</button>
      </div>
    </div>

    <section class="metrics" id="metrics"></section>

    <div class="stack">
      <section class="panel">
        <div class="panel__head">
          <span class="panel__title">Items</span>
          <span class="panel__tools">
            <div class="toolbar__search">
              <label class="sr-only" for="q">Search items</label>
              <span data-icon="search"></span>
              <input class="input input--sm" id="q" type="search" placeholder="Search item or code">
            </div>
            <label class="sr-only" for="fCat">Filter by category</label>
            <select class="select select--sm" id="fCat"><option value="all">All categories</option></select>
            <label class="sr-only" for="fLevel">Filter by level</label>
            <select class="select select--sm" id="fLevel">
              <option value="all">All levels</option>
              <option value="low">Needs reorder</option>
              <option value="critical">Critical only</option>
            </select>
            <span class="toolbar__count" id="count"></span>
          </span>
        </div>
        <div class="panel__body panel__body--flush" id="list"></div>
      </section>

      <div class="grid grid--2">
        <section class="panel">
          <div class="panel__head"><span class="panel__title">Suppliers</span></div>
          <div class="panel__body panel__body--flush" id="suppliers"></div>
        </section>
        <section class="panel">
          <div class="panel__head"><span class="panel__title">Deliveries</span></div>
          <div class="panel__body panel__body--flush" id="deliveries"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel__head">
          <span class="panel__title">Stock movement</span>
          <span class="panel__tools"><span class="toolbar__count" id="moveCount"></span></span>
        </div>
        <div class="panel__body panel__body--flush" id="movement"></div>
      </section>
    </div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/queries.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/pages/inventory.js"></script>
</body>
</html>
