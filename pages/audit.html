<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Trail &middot; PATVEP Hostel &amp; Canteen</title>
<link rel="icon" type="image/png" href="../assets/img/bpsu-logo.png">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<main class="main">
  <div class="page">

    <div class="page__head">
      <div>
        <h1>Audit Trail</h1>
        <div class="page__meta" id="pageMeta"></div>
      </div>
      <div class="page__actions"></div>
    </div>

    <div id="notice"></div>

    <section class="panel">
      <div class="panel__head"><span class="panel__title">Activity log</span></div>
      <div class="toolbar">
        <div class="toolbar__search">
          <label class="sr-only" for="q">Search the log</label>
          <span data-icon="search"></span>
          <input class="input input--sm" id="q" type="search"
                 placeholder="Search user, action or description">
        </div>
        <label class="sr-only" for="fAction">Filter by action</label>
        <select class="select select--sm" id="fAction"><option value="all">All actions</option></select>
        <label class="sr-only" for="fEntity">Filter by area</label>
        <select class="select select--sm" id="fEntity"><option value="all">All areas</option></select>
        <span class="toolbar__count" id="count"></span>
      </div>
      <div class="panel__body panel__body--flush" id="log"></div>
    </section>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/queries.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/pages/audit.js"></script>
</body>
</html>
