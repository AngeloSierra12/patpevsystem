<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Reservation &middot; PATVEP Hostel &amp; Canteen</title>
<link rel="icon" type="image/png" href="../assets/img/bpsu-logo.png">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<main class="main">
  <div class="page">

    <div class="page__head">
      <div>
        <h1>Hotel Reservation</h1>
        <div class="page__meta" id="pageMeta"></div>
      </div>
      <div class="page__actions">
        <button class="btn" id="btnGuest" data-icon="account">Register guest</button>
        <button class="btn btn--go" id="btnBook" data-icon="plus">New reservation</button>
      </div>
    </div>

    <div id="notice"></div>

    <section class="panel" style="margin-bottom:var(--gap)">
      <div class="panel__head">
        <span class="panel__title">Reservations</span>
        <span class="panel__tools">
          <label class="sr-only" for="fStatus">Filter by status</label>
          <select class="select select--sm" id="fStatus">
            <option value="all">All statuses</option>
            <option value="PENDING">Pending</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="CHECKED_IN">Checked in</option>
            <option value="CHECKED_OUT">Checked out</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </span>
      </div>
      <div class="panel__body panel__body--flush" id="list"></div>
    </section>

    <div class="grid grid--side">
      <section class="panel">
        <div class="panel__head">
          <span class="panel__title">Rooms and availability</span>
          <span class="panel__tools">
            <label class="sr-only" for="avFrom">Available from</label>
            <input class="input input--sm" type="date" id="avFrom">
            <label class="sr-only" for="avTo">Available to</label>
            <input class="input input--sm" type="date" id="avTo">
            <button class="btn btn--sm" id="avCheck">Check</button>
          </span>
        </div>
        <div class="panel__body panel__body--flush" id="rooms"></div>
      </section>
      <section class="panel">
        <div class="panel__head"><span class="panel__title">Guest details</span></div>
        <div class="panel__body panel__body--flush" id="guest"></div>
      </section>
    </div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/queries.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/pages/reservations.js"></script>
</body>
</html>
